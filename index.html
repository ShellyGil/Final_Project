<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nociceptor Suite v1.0</title>
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2023.05.1/pyscript.css" />
    <script defer src="https://pyscript.net/releases/2023.05.1/pyscript.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/utif@3.1.0/UTIF.js"></script>
    
    <py-config>
        packages = ["pandas", "matplotlib", "scipy", "numpy", "statsmodels"]
    </py-config>

    <style>
        /* This CSS handles the Tab switching without touching your algorithm CSS */
        .module-container { display: none; }
        .module-container.active { display: block; }
        
        nav { background: #2c3e50; padding: 10px; display: flex; gap: 10px; }
        .nav-btn { background: #34495e; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; }
        .nav-btn.active { background: #3498db; }
        
        /* Your original CSS from all three files can be pasted here directly */
        /* I recommend wrapping them in a container ID if they conflict */
    </style>
</head>
<body>

<nav>
    <button class="nav-btn active" onclick="openModule(event, 'quantifier')">1. Quantifier</button>
    <button class="nav-btn" onclick="openModule(event, 'analyst')">2. Analyst</button>
    <button class="nav-btn" onclick="openModule(event, 'illustrator')">3. Illustrator</button>
</nav>

<div id="quantifier" class="module-container active">
    </div>

<div id="analyst" class="module-container">
    </div>

<div id="illustrator" class="module-container">
    </div>

<script>
    function openModule(evt, moduleName) {
        // Hide all modules
        var i, content, navlinks;
        content = document.getElementsByClassName("module-container");
        for (i = 0; i < content.length; i++) {
            content[i].style.display = "none";
        }
        // Deactivate all buttons
        navlinks = document.getElementsByClassName("nav-btn");
        for (i = 0; i < navlinks.length; i++) {
            navlinks[i].className = navlinks[i].className.replace(" active", "");
        }
        // Show current module and set button to active
        document.getElementById(moduleName).style.display = "block";
        evt.currentTarget.className += " active";
    }
</script>

</body>
</html>
